name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/mikrosaas

jobs:
  # ========================================
  # 1. TESTOWANIE BACKEND
  # ========================================
  test-backend:
    name: Test Backend Services
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: |
          cd app/backend
          dotnet restore IdentityService/IdentityService.csproj
          dotnet restore ReservationService/ReservationService.csproj
          dotnet restore NotificationService/NotificationService.csproj
          dotnet restore ApiGateway/ApiGateway.csproj
      
      - name: Build services
        run: |
          cd app/backend
          dotnet build IdentityService/IdentityService.csproj --no-restore -c Release
          dotnet build ReservationService/ReservationService.csproj --no-restore -c Release
          dotnet build NotificationService/NotificationService.csproj --no-restore -c Release
          dotnet build ApiGateway/ApiGateway.csproj --no-restore -c Release
      
      - name: Run tests
        run: |
          cd app/backend
          dotnet test IdentityService.Tests/IdentityService.Tests.csproj --verbosity normal
          dotnet test ReservationService.Tests/ReservationService.Tests.csproj --verbosity normal
          dotnet test NotificationService.Tests/NotificationService.Tests.csproj --verbosity normal

  # ========================================
  # 2. TESTOWANIE FRONTEND
  # ========================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/frontend/my-frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd app/frontend/my-frontend
          npm ci
      
      - name: Run linter
        run: |
          cd app/frontend/my-frontend
          npm run lint || true
      
      - name: Build frontend
        run: |
          cd app/frontend/my-frontend
          npm run build
      
      - name: Run tests
        run: |
          cd app/frontend/my-frontend
          npm run test:ci

  # ========================================
  # 2.5. TESTY INTEGRACYJNE (docker compose up)
  # ========================================
  compose-smoke-tests:
    name: Docker Compose Smoke Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Start stack (docker compose)
        run: |
          docker compose -f app/backend/docker-compose.yml up -d --build

      - name: Wait for API Gateway health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5000/health > /dev/null 2>&1; then
              echo "API Gateway is healthy"
              exit 0
            fi
            sleep 5
          done

          echo "API Gateway did not become healthy in time"
          docker compose -f app/backend/docker-compose.yml ps
          docker compose -f app/backend/docker-compose.yml logs --tail=200
          exit 1

      - name: Run smoke tests
        run: |
          wait_url() {
            url="$1"
            label="$2"
            for i in {1..60}; do
              if curl -fsS "$url" > /dev/null 2>&1; then
                echo "$label OK"
                return 0
              fi
              sleep 3
            done

            echo "$label FAILED: $url"
            return 1
          }

          wait_url http://localhost:5000/health "API Gateway /health"
          wait_url http://localhost:5001/health "Identity /health"
          wait_url http://localhost:5002/health "Reservation /health"
          wait_url http://localhost:5003/health "Notification /health"

          wait_url http://localhost:5000/identity/health "Gateway -> Identity routing"
          wait_url http://localhost:5000/reservation/health "Gateway -> Reservation routing"

          for i in {1..60}; do
            services=$(curl -fsS http://localhost:5000/reservation/services 2>/dev/null || true)
            if echo "$services" | grep -Eq "serviceName|\[\s*\]"; then
              echo "GET /reservation/services OK"
              exit 0
            fi
            sleep 3
          done

          echo "GET /reservation/services FAILED"
          echo "$services"
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f app/backend/docker-compose.yml ps
          docker compose -f app/backend/docker-compose.yml logs --tail=300

      - name: Tear down
        if: always()
        run: |
          docker compose -f app/backend/docker-compose.yml down -v

  # ========================================
  # 3. SKANOWANIE BEZPIECZEŃSTWA
  # ========================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy security scan on Dockerfiles
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'app/backend'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ========================================
  # 4. BUDOWANIE OBRAZÓW DOCKER
  # ========================================
  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, compose-smoke-tests]
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    strategy:
      matrix:
        service:
          - name: api-gateway
            context: ./app/backend/ApiGateway
          - name: identity-service
            context: ./app/backend/IdentityService
          - name: reservation-service
            context: ./app/backend/ReservationService
          - name: notification-service
            context: ./app/backend/NotificationService
          - name: frontend
            context: ./app/frontend/my-frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # 5. DEPLOY NA STAGING (develop branch)
  # ========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-docker-images, security-scan]
    if: false  # WYŁĄCZONE - brak serwera staging, odkomentuj gdy będziesz mieć serwer
    # if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.twoja-domena.pl
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      
      - name: Deploy to staging server
        run: |
          echo "Deploying to staging..."
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /opt/mikrosaas
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d
          EOF
        continue-on-error: true  # Pozwól na błąd jeśli serwer nie jest skonfigurowany

  # ========================================
  # 6. DEPLOY NA PRODUKCJĘ (main branch)
  # ========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker-images, security-scan]
    if: false  # WYŁĄCZONE - brak serwera produkcyjnego, odkomentuj gdy będziesz mieć serwer
    # if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://twoja-domena.pl
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      
      - name: Deploy to production server
        run: |
          echo "Deploying to production..."
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /opt/mikrosaas
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d
          EOF
        continue-on-error: true  # Pozwól na błąd jeśli serwer nie jest skonfigurowany

  # ========================================
  # 7. TESTY E2E (End-to-End)
  # ========================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: false  # WYŁĄCZONE - E2E testy wymagają działającego staging
    # if: github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Playwright
        run: |
          cd app/frontend/my-frontend
          npm ci
          npx playwright install --with-deps
      
      - name: Run E2E tests
        run: |
          cd app/frontend/my-frontend
          # npx playwright test
          echo "E2E tests will be configured later"
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: app/frontend/playwright-report/
          retention-days: 30
