services:
  # API Gateway (Ocelot) - główny punkt wejścia
  api_gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    ports:
      - "5000:8080"  # Główny port dla całego API
    depends_on:
      identity_api:
        condition: service_started
      reservation_api:
        condition: service_started
      notification_api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # JWT settings
      JwtSettings__SecretKey: "super-secret-key-for-jwt-token-generation-minimum-32-characters-long-1234567890"
      JwtSettings__Issuer: "MikroSaaS-IdentityService"
      JwtSettings__Audience: "MikroSaaS-Apps"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Kontener bazy PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: password_secure
      POSTGRES_MULTIPLE_DATABASES: identitydb,reservationdb,notificationdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kontener mikroserwisu Identity
  identity_api:
    build:
      context: ./IdentityService # Ścieżka do folderu z projektem
      dockerfile: Dockerfile
    ports:
      - "5001:8080" # Mapowanie portu hosta:port kontenera
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      # Ciąg połączenia, używający nazwy serwisu 'postgres_db' jako Hosta!
      ConnectionStrings__IdentityConnection: "Host=postgres_db;Port=5432;Database=identitydb;Username=dbuser;Password=password_secure"
      ASPNETCORE_ENVIRONMENT: Development

  # Kontener mikroserwisu Reservation
  reservation_api:
    build:
      context: ./ReservationService
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      ConnectionStrings__ReservationConnection: "Host=postgres_db;Port=5432;Database=reservationdb;Username=dbuser;Password=password_secure"
      ASPNETCORE_ENVIRONMENT: Development

  # Kontener mikroserwisu Notification
  notification_api:
    build:
      context: ./NotificationService
      dockerfile: Dockerfile
    ports:
      - "5003:8080"
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__NotificationConnection: "Host=postgres_db;Port=5432;Database=notificationdb;Username=dbuser;Password=password_secure"
      ASPNETCORE_ENVIRONMENT: Development
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest

  # Kontener RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
