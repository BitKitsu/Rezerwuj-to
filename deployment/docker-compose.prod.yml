version: '3.8'

services:
  # API Gateway - główny punkt wejścia
  api_gateway:
    image: ghcr.io/yourusername/mikrosaas-api-gateway:latest
    container_name: mikrosaas-api-gateway
    restart: always
    ports:
      - "80:8080"     # HTTP
      - "443:8443"    # HTTPS
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${SSL_CERT_PASSWORD}
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/cert.pfx
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
    volumes:
      - ./ssl:/https:ro
      - ./logs/gateway:/app/logs
    depends_on:
      - identity_api
      - reservation_api
      - notification_api
    networks:
      - mikrosaas-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # PostgreSQL Database
  postgres_db:
    image: postgres:15-alpine
    container_name: mikrosaas-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: identitydb,reservationdb,notificationdb
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
      - ./backups:/backups
    networks:
      - mikrosaas-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mikrosaas-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: mikrosaas
    ports:
      - "15672:15672"  # Management UI (należy zabezpieczyć!)
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq
    networks:
      - mikrosaas-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Identity Service
  identity_api:
    image: ghcr.io/yourusername/mikrosaas-identity-service:latest
    container_name: mikrosaas-identity
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__IdentityConnection: ${IDENTITY_DB_CONNECTION}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
    volumes:
      - ./logs/identity:/app/logs
    depends_on:
      - postgres_db
    networks:
      - mikrosaas-network
    deploy:
      replicas: 2  # Skalowanie poziome
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Reservation Service
  reservation_api:
    image: ghcr.io/yourusername/mikrosaas-reservation-service:latest
    container_name: mikrosaas-reservation
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ReservationConnection: ${RESERVATION_DB_CONNECTION}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    volumes:
      - ./logs/reservation:/app/logs
    depends_on:
      - postgres_db
      - rabbitmq
    networks:
      - mikrosaas-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Notification Service
  notification_api:
    image: ghcr.io/yourusername/mikrosaas-notification-service:latest
    container_name: mikrosaas-notification
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__NotificationConnection: ${NOTIFICATION_DB_CONNECTION}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      EmailSettings__SmtpHost: ${SMTP_HOST}
      EmailSettings__SmtpPort: ${SMTP_PORT}
      EmailSettings__SmtpUser: ${SMTP_USER}
      EmailSettings__SmtpPassword: ${SMTP_PASSWORD}
    volumes:
      - ./logs/notification:/app/logs
    depends_on:
      - postgres_db
      - rabbitmq
    networks:
      - mikrosaas-network
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  # Nginx jako Load Balancer (opcjonalnie)
  nginx:
    image: nginx:alpine
    container_name: mikrosaas-nginx
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api_gateway
    networks:
      - mikrosaas-network

  # Monitoring - Prometheus (opcjonalnie)
  prometheus:
    image: prom/prometheus:latest
    container_name: mikrosaas-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_prod:/prometheus
    networks:
      - mikrosaas-network

  # Monitoring - Grafana (opcjonalnie)
  grafana:
    image: grafana/grafana:latest
    container_name: mikrosaas-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - mikrosaas-network

networks:
  mikrosaas-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data_prod:
  rabbitmq_data_prod:
  prometheus_data_prod:
  grafana_data_prod:
