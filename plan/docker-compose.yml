version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: reservation-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Admin123!}
      POSTGRES_MULTIPLE_DATABASES: identity_db,reservation_db,notification_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    networks:
      - reservation-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: reservation-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - reservation-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (optional, for performance)
  redis:
    image: redis:7-alpine
    container_name: reservation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reservation-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway (Ocelot)
  api-gateway:
    build:
      context: ./src/ApiGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - "5000:5000"
    depends_on:
      - identity-api
      - reservation-api
      - notification-api
    networks:
      - reservation-network
    restart: unless-stopped

  # Identity Microservice
  identity-api:
    build:
      context: ./src/Services/Identity
      dockerfile: Dockerfile
    container_name: identity-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__IdentityDb=Host=postgres;Port=5432;Database=identity_db;Username=admin;Password=Admin123!
      - JWT__Secret=${JWT_SECRET:-your-256-bit-secret-key-for-jwt-token-generation}
      - JWT__Issuer=reservation-system
      - JWT__Audience=reservation-users
      - RabbitMQ__Host=rabbitmq
      - Redis__Connection=redis:6379
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reservation-network
    restart: unless-stopped

  # Reservation Microservice
  reservation-api:
    build:
      context: ./src/Services/Reservation
      dockerfile: Dockerfile
    container_name: reservation-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__ReservationDb=Host=postgres;Port=5432;Database=reservation_db;Username=admin;Password=Admin123!
      - RabbitMQ__Host=rabbitmq
      - Redis__Connection=redis:6379
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reservation-network
    restart: unless-stopped

  # Notification Microservice
  notification-api:
    build:
      context: ./src/Services/Notification
      dockerfile: Dockerfile
    container_name: notification-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5003
      - ConnectionStrings__NotificationDb=Host=postgres;Port=5432;Database=notification_db;Username=admin;Password=Admin123!
      - RabbitMQ__Host=rabbitmq
      - SendGrid__ApiKey=${SENDGRID_API_KEY}
      - SendGrid__FromEmail=${SENDGRID_FROM_EMAIL:-noreply@reservation-system.com}
      - Hangfire__ConnectionString=Host=postgres;Port=5432;Database=notification_db;Username=admin;Password=Admin123!
    ports:
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - reservation-network
    restart: unless-stopped

  # Frontend React Application
  frontend:
    build:
      context: ./src/Web/WebApp
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:5000
    container_name: reservation-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - REACT_APP_ENVIRONMENT=development
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - reservation-network
    volumes:
      - ./src/Web/WebApp:/app
      - /app/node_modules
    restart: unless-stopped

  # Seq for structured logging (optional but recommended)
  seq:
    image: datalust/seq:latest
    container_name: reservation-seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    networks:
      - reservation-network

  # pgAdmin for database management (development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: reservation-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - reservation-network
    depends_on:
      - postgres

networks:
  reservation-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  seq_data:
  pgadmin_data:
